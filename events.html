<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="logo.png?v=2">
    <title>Browse Events - MCCC Stats</title>
    <meta name="description" content="Browse all Minecraft Championship Copy events.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lexend+Deca:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
<header class="site-header">
    <nav class="navbar">
        <div class="navbar-start">
            <img src="logo.png" alt="MCCC Logo" style="width:32px;height:32px;object-fit:contain;vertical-align:middle;margin-right:10px;">
            <a href="index.html" class="navbar-brand">MCCC Stats</a>
        </div>
        <div class="navbar-search">
            <label for="navbar-player-search" class="sr-only">Search for a player</label>
            <input type="search" id="navbar-player-search" class="navbar-search-input" placeholder="Search player..." autocomplete="off">
            <div id="navbar-search-results" class="navbar-search-results" hidden></div>
        </div>
        <div class="navbar-end">
            <a href="index.html" class="nav-link">Home</a>
            <a href="events.html" class="nav-link active" aria-current="page">Events</a>
            <a href="players.html" class="nav-link">Players</a>
            <a href="compare.html" class="nav-link">Compare</a>
            <a href="records.html" class="nav-link">Records</a>
            <a href="teambuilder.html" class="nav-link">Team Builder</a>
        </div>
    </nav>
</header>
<main>
    <section class="hero events-hero bg-main-lobby">
        <div class="hero-overlay"></div>
        <div class="hero-content"><div class="hero-inner"><h1 class="events-page-title">Browse Events</h1></div></div>
    </section>
    <section class="events-container" aria-label="MCCC event archive">
        <div class="events-archive-heading"><h2>Event Archive</h2><p>Explore MCCC results and statistics</p></div>
        <div class="events-filters" id="events-filters" role="group" aria-label="Filter events">
            <button type="button" data-filter="all" class="active" aria-pressed="true">All Events</button>
            <button type="button" data-filter="1" aria-pressed="false">Season 1</button>
            <button type="button" data-filter="2" aria-pressed="false">Season 2</button>
            <button type="button" data-filter="noncanon" aria-pressed="false">Non-Canon</button>
        </div>
        <div class="events-archive" id="events-grid" aria-live="polite"></div>
    </section>
</main>
<script src="js/data.js"></script>
<script src="js/main.js"></script>
<script src="js/events.js"></script>
</body>
</html>
