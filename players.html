
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="logo.png?v=2">
  <title>Players | MCCC Stats</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/players.css">
</head>
<body>
  
<header class="site-header">
  <nav class="navbar">

    <div class="navbar-start">
      <img src="logo.png" alt="MCCC Logo"
     style="width:32px;height:32px;object-fit:contain;vertical-align:middle;margin-right:10px;">
      <a href="index.html" class="navbar-brand">
        MCCC Stats
      </a>
    </div>

    <div class="navbar-search">
      <label for="navbar-player-search" class="sr-only">
        Search for a player
      </label>

      <input
        type="search"
        id="navbar-player-search"
        class="navbar-search-input"
        placeholder="Search player..."
        autocomplete="off"
      >

      <div
        id="navbar-search-results"
        class="navbar-search-results"
        hidden
      ></div>
    </div>

    <div class="navbar-end">
      <a href="index.html" class="nav-link">Home</a>
      <a href="events.html" class="nav-link">Events</a>
      <a href="players.html" class="nav-link active">Players</a>
      <a href="compare.html" class="nav-link">Compare</a>
      <a class="nav-link" href="records.html">Records</a>
      <a href="teambuilder.html" class="nav-link">Team Builder</a>
    </div>

  </nav>
</header>


  <main class="homepage-container players-page">
    <section class="homepage-section">
      <div class="section-header"><h1 class="section-title">Players</h1></div>
      <div class="section-content players-content">
        <div class="players-toolbar">
          <div class="players-toolbar-heading">
            <h2>Player Leaderboard</h2>
            <p>Compare individual performances across MCCC events.</p>
          </div>
          <label class="players-noncanon-toggle">
            <input type="checkbox" id="players-noncanon">
            <span>Include Non-Canon Events</span>
          </label>
          
<label class="players-noncanon-toggle">
    <input type="checkbox" id="players-incomplete">
    <span>Include Incomplete Events</span>
</label>

        </div>

        <div class="players-filters">
          <label class="players-search">Search Players
            <input id="players-search" type="search" placeholder="Search by username..." autocomplete="off">
          </label>
          
<label>Events
  <select id="players-season">
    <option value="last1">Last 1</option>
    <option value="last2">Last 2</option>
    <option value="last3">Last 3</option>
    <option value="last5">Last 5</option>
    <option value="1">Season 1</option>
    <option value="2">Season 2</option>
    <option value="all" selected>All Events</option>
  </select>
</label>

          <label>Sort By
            <select id="players-sort">
              <option value="average">Average Coins</option>
              <option value="best">Best Event Score</option>
              <option value="placement">Average Placement</option>
              <option value="events">Events Played</option>
              <option value="alphabetical">Alphabetical (A-Z)</option>
            </select>
          </label>
          <label>Minimum Events
            <select id="players-minimum">
              <option value="1">1+ Events</option>
              <option value="2">2+ Events</option>
              <option value="3">3+ Events</option>
              <option value="5">5+ Events</option>
            </select>
          </label>
          <label>Scores
            <select id="players-scores">
              <option value="normalized" selected>Normalised</option>
              <option value="raw">Raw</option>
            </select>
          </label>
        </div>

        <div class="players-results-heading">
          <span id="players-count" aria-live="polite"></span>
          <span>Individual unmultiplied coins</span>
        </div>

        <div class="players-table-wrap">
          <table class="stats-table players-table">
            <thead><tr>
              <th scope="col">#</th>
              <th scope="col"><button type="button" class="players-sort-heading" data-sort="alphabetical">Player <span class="players-sort-arrow" aria-hidden="true"></span></button></th>
              <th scope="col"><button type="button" class="players-sort-heading" data-sort="average">Average Coins <span class="players-sort-arrow" aria-hidden="true"></span></button></th>
              <th scope="col"><button type="button" class="players-sort-heading" data-sort="events">Events <span class="players-sort-arrow" aria-hidden="true"></span></button></th>
              <th scope="col"><button type="button" class="players-sort-heading" data-sort="best">Best Event <span class="players-sort-arrow" aria-hidden="true"></span></button></th>
              <th scope="col"><button type="button" class="players-sort-heading" data-sort="placement">Avg Placement <span class="players-sort-arrow" aria-hidden="true"></span></button></th>
            </tr></thead>
            <tbody id="players-body"></tbody>
          </table>
        </div>

        <div class="players-pagination">
          <button id="players-prev" type="button">Previous</button>
          <span id="players-page-label"></span>
          <button id="players-next" type="button">Next</button>
        </div>
      </div>
    </section>
  </main>

  <script src="js/data.js"></script>
<script src="js/main.js"></script>
<script src="js/players.js"></script>
</body>
</html>
